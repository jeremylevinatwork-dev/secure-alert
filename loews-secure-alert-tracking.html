<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loews Secure Alert Tracking</title>
<style>
:root{
  --navy:#0e2a47; --navy2:#143a61; --gold:#c9a227; --bg:#eef1f5; --card:#ffffff;
  --ink:#1c2733; --muted:#68788c; --line:#dde4ec; --green:#1e7e46; --amber:#a86a00;
  --red:#b3261e; --blue:#1a5fb4; --gray:#5f6b7a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); padding-bottom:0;
  display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;}
header{background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff;
  padding:18px 16px 14px; position:sticky; top:0; z-index:20;}
header h1{margin:0; font-size:19px; letter-spacing:.3px;}
header h1 .gold{color:var(--gold);}
header p{margin:4px 0 0; font-size:12px; color:#b9c7d8;}
header.branded{background:#fff; padding:0;}
.logos{display:flex; align-items:center; justify-content:center; gap:28px; padding:14px 12px 12px; background:#fff;}
.logos img{max-height:48px; width:auto; max-width:45%; object-fit:contain;}
.apptitle{background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:10px 16px 12px;}
.apptitle h1{margin:0; font-size:17px; letter-spacing:.3px; color:#fff;}
.apptitle p{margin:3px 0 0; font-size:12px; color:#b9c7d8;}
#propbar{display:flex; gap:8px; overflow-x:auto; padding:10px 12px; background:#fff;
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:19;}
/* note: propbar sits under header; header height varies so we keep propbar static instead */
#propbar{position:static;}
.chip{flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer;}
.chip.active{background:var(--navy); border-color:var(--navy); color:#fff;}
main{max-width:620px; margin:0 auto; padding:14px 12px 40px; flex:1 1 auto; overflow-y:auto; width:100%;}
section.tab{display:none;}
section.tab.active{display:block;}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(16,42,71,.05);}
.card h3{margin:0 0 8px; font-size:15px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
.tile{flex:1 1 0; min-width:120px; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:12px; text-align:center;}
.tile .n{font-size:26px; font-weight:800; color:var(--navy);}
.tile .l{font-size:11px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.4px;}
.tile.warn .n{color:var(--amber);}
.tile.bad .n{color:var(--red);}
.fob{cursor:pointer;}
.fob-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.fob-id{font-size:17px; font-weight:800; color:var(--navy);}
.fob-meta{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5;}
.fobpick{width:27px;height:27px;flex:0 0 auto;margin-top:3px;accent-color:#b7791f;cursor:pointer;}
.card.fob.picked{outline:3px solid var(--gold);background:#fffaf0;}
.selbar{position:sticky;top:0;z-index:6;background:#12284b;color:#fff;border-radius:12px;padding:10px 12px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;}
.badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
  text-transform:uppercase; letter-spacing:.4px; white-space:nowrap;}
.b-green{background:#e2f3e9; color:var(--green);}
.b-amber{background:#fdf0d7; color:var(--amber);}
.b-red{background:#fbe4e2; color:var(--red);}
.b-purple{background:#ece5f9; color:#6a3fb5;}
.b-blue{background:#e3edfb; color:var(--blue);}
.b-gray{background:#eceff3; color:var(--gray);}
.pchip{display:inline-block; font-size:11px; font-weight:800; background:var(--navy); color:#fff;
  border-radius:6px; padding:3px 8px; letter-spacing:.5px; margin-right:6px;}
.doc{cursor:pointer;}
.doc-title{font-size:15px; font-weight:700;}
.doc-meta{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.5;}
.btn{display:inline-block; border:none; border-radius:10px; padding:14px 16px; font-size:15px;
  font-weight:700; cursor:pointer; text-align:center;}
.btn-primary{background:var(--navy); color:#fff; width:100%;}
.btn-gold{background:var(--gold); color:#1c2733; width:100%;}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;font-weight:700}
.chk input{width:20px;height:20px;margin-top:1px;flex:none}
.chk .note{font-weight:400}
.btn-ghost{background:#fff; color:var(--navy); border:1.5px solid var(--navy); width:100%; margin-top:8px;}
.btn-danger{background:#fff; color:var(--red); border:1.5px solid var(--red); width:100%; margin-top:8px;}
.btn-sm{width:auto; padding:9px 14px; font-size:14px;}
.toolbar{display:flex; gap:8px; margin-bottom:12px;}
.toolbar input{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px;}
select,input[type=text],input[type=date],input[type=datetime-local],textarea{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px;
  font-size:15px; margin:6px 0 12px; font-family:inherit; background:#fff; color:var(--ink);}
label{font-size:13px; font-weight:700; color:var(--navy);}
#bottomnav{position:static; flex:0 0 auto; width:100%; background:#fff; border-top:1px solid var(--line);
  display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom);}
#bottomnav button{flex:1; border:none; background:none; padding:11px 0 9px; font-size:11px;
  font-weight:700; color:var(--muted); cursor:pointer;}
#bottomnav button.active{color:var(--navy);}
#bottomnav button .ico{display:block; font-size:20px; margin-bottom:2px;}
#modal{position:fixed; inset:0; background:rgba(10,25,45,.55); display:none; z-index:50;
  align-items:flex-end; justify-content:center;}
#modal.open{display:flex;}
#sheet{background:#fff; width:100%; max-width:620px; max-height:92vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:18px 16px 30px;}
#sheet h2{margin:0 0 4px; font-size:18px; color:var(--navy);}
#sheet .sub{font-size:13px; color:var(--muted); margin-bottom:10px;}
.hist{border-left:3px solid var(--line); margin:10px 0 0 4px; padding-left:12px;}
.hist div{font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line);}
.hist .t{color:var(--muted); font-size:11px;}
.empty{text-align:center; color:var(--muted); padding:28px 12px; font-size:14px;}
.kv{display:flex; justify-content:space-between; font-size:14px; padding:7px 0; border-bottom:1px solid var(--line);}
.kv:last-child{border-bottom:none;}
.kv b{color:var(--navy);}
table.props{width:100%; border-collapse:collapse; font-size:14px;}
table.props th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted);
  padding:8px 6px; border-bottom:2px solid var(--line);}
table.props td{padding:9px 6px; border-bottom:1px solid var(--line);}
.dashprops td{padding:5px 6px; font-size:13px;}
.dashprops th{padding:5px 6px;}
.dashprops td:first-child b{font-size:13px;}
.tscroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
@media (max-width:700px){
  table.props{font-size:12px;}
  table.props th{font-size:9.5px; padding:6px 4px; letter-spacing:.02em;}
  table.props td{padding:7px 4px;}
  table.props td:first-child{max-width:118px;}
}
.note{font-size:12px; color:var(--muted); line-height:1.5;}
h2.sec{font-size:16px; color:var(--navy); margin:18px 0 10px;}
.idrow{display:flex; gap:8px; align-items:stretch;}
.idrow input,.idrow select{flex:1;}
.idrow .btn{width:auto; white-space:nowrap; margin:6px 0 12px;}
#scanwrap{position:relative; background:#000; border-radius:12px; overflow:hidden; margin:6px 0 10px;} #scanwrap:after{content:""; position:absolute; left:24%; right:24%; top:12%; bottom:12%; border:3px solid rgba(212,175,55,.95); border-radius:14px; pointer-events:none;}
#scanvideo{width:100%; max-height:320px; display:block; background:#000;}
#scanmsg{margin:8px 0;}
.toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--navy); color:#fff;
  padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; z-index:99; display:none;
  max-width:90vw; text-align:center;}
header.branded{position:static;}
.req{color:var(--red); font-weight:800;}
.help ol{margin:10px 0 14px; padding-left:20px;}
.help li{margin:8px 0; font-size:14px; line-height:1.45;}
@media (min-width:900px){
  main{max-width:980px; padding:18px 16px;}
  .cards2{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start;}
  .cards2 .card{margin-bottom:0;}
  .tile{min-width:150px;}
  #bottomnav{max-width:980px; margin-left:auto; margin-right:auto;}
  .logos img{max-height:60px;}
}

.login-screen{position:fixed; inset:0; background:var(--navy); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
.login-card{background:#fff; border-radius:14px; padding:26px 22px; width:100%; max-width:360px;}
.login-card h2{margin:0 0 4px;}
.login-card .btn{margin-top:6px;}

.tile.tap{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.tile.tap:active{transform:scale(.965);}
/* ---------- print reports (same method as Radio app) ---------- */
#print-area{display:none;}
@media print{
  @page{margin:0.6in;}
  html,body{background:#fff !important;}
  body{display:block !important; height:auto !important; overflow:visible !important;}
  main{overflow:visible !important;}
  body.report-open>*:not(#report-view){display:none !important;}
  body.report-open #report-view{display:block !important; position:static !important; overflow:visible !important; padding:0 !important;}
  body.report-open #report-view .report-bar{display:none !important;}
  body.report-open #report-view-body{color:#000; font-family:Arial,sans-serif;}
}

function ticketToFob(t){
  // Builds a documented fob record from an approved customer-portal ticket.
  const iss = String(t.issue||"");
  let st = "Broken";
  if(t.warranty===true) st = "Warranty";
  else if(/broken/i.test(iss)) st = "Broken";
  else if(/charg/i.test(iss)) st = "Not Able to Charge";
  const tid = t.ticketId || t.id || "";
  return { uid: uid("fob"), fobId: String(t.fobId), prop: t.hotelCode || "", dept: "",
    status: st, staff: "", shift: "", battery: "",
    notes: "From customer ticket " + tid + (t.managerNotes ? " \u2014 " + t.managerNotes : ""),
    replacement: false, fromTicket: tid,
    hist: [{ t: nowLocal(), e: "Added from approved customer ticket " + tid + " (" + iss + ")" + (t.approvedBy ? " \u00b7 Approved by " + t.approvedBy : "") }] };
}

async function sbPush(){
  sbBadge(true, true);
  if(!S._ts){ S._ts = Date.now(); try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
  try{
    var payload = JSON.parse(JSON.stringify(S));
    if('session' in payload) payload.session = null;
    var res = await fetch(SB_URL + '/rest/v1/app_records', {
      method: 'POST',
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify({id: SB_ROW_ID, app: SB_APP, data: payload})
    });
    if(res.ok){
      sbDirty = false;
      var now = new Date().toISOString();
      try{ localStorage.setItem(LS_KEY + '-cloud-ts', now); }catch(e){}
      sbBadge(true, false);
    } else sbBadge(false, false);
  }catch(e){ sbBadge(false, false); }
}
function recCount(d){ d = d || {}; return (d.fobs ? d.fobs.length : 0) + (d.subs ? d.subs.length : 0) + (d.docs ? d.docs.length : 0); }
async function sbPull(){
  try{
    var res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + encodeURIComponent(SB_ROW_ID) + '&select=data', {
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY}
    });
    if(!res.ok) return;
    var rows = await res.json();
    if(!rows || !rows.length){ if(recCount(S) > 0) sbPush(); return; }
    var cloud = rows[0].data || {};
    /* Never overwrite local work that has not reached the cloud yet. */
    if(sbDirty){ sbPush(); return; }
    /* The database updated_at never changes on upsert, so sync order is
       decided by the _ts edit stamp carried inside the data itself. */
    var cloudTs = cloud._ts || 0, localTs = S._ts || 0;
    var takeCloud = function(){
      var keepSession = S.session;
      S = cloud;
      normState();
      S.session = keepSession;
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      if(typeof render === 'function'){ try{ render(); }catch(e){} }
      sbBadge(true, false);
    };
    if(cloudTs === 0 && localTs === 0){
      /* Legacy data with no stamps: the side holding more records wins once,
         then its push stamps the cloud for everyone. */
      if(recCount(S) >= recCount(cloud)){
        if(recCount(S) > 0 || recCount(cloud) > 0) sbPush(); else sbBadge(true, false);
        return;
      }
      takeCloud(); sbPush(); return;
    }
    if(cloudTs > localTs){
      if(recCount(cloud) === 0 && recCount(S) > 0){ sbPush(); return; }
      /* A device that has never run the stamped sync (localTs 0) and holds
         MORE records than the cloud keeps its data — it becomes the source. */
      if(localTs === 0 && recCount(S) > recCount(cloud)){ sbPush(); return; }
      takeCloud(); return;
    }
    if(localTs > cloudTs){ sbPush(); return; }
    sbBadge(true, false);
  }catch(e){}
}
function sbSchedulePush(){
  if(sbSyncTimer) clearTimeout(sbSyncTimer);
  sbSyncTimer = setTimeout(sbPush, 2000);
}

function brokeWithinYear(f){
  if(!f || !f.hist || !f.hist.length) return false;
  const times = f.hist.map(x=>Date.parse(x.t)).filter(n=>!isNaN(n));
  if(!times.length) return false;
  const reg = Math.min.apply(null, times);
  let fail = null;
  f.hist.forEach(x=>{
    if(/Status → (Broken|Warranty)/.test(x.e||"")){
      const t = Date.parse(x.t);
      if(!isNaN(t) && (fail===null || t<fail)) fail = t;
    }
  });
  if(fail===null && (f.status==="Broken" || f.status==="Warranty")){
    const last = Math.max.apply(null, times);
    if(f.hist.some(x=>/ticket/i.test(x.e||""))) fail = reg;
    else if(last > reg) fail = last;
  }
  if(fail===null) return false;
  return (fail - reg) <= 365*24*60*60*1000;
}
function brokeWithinYearCount(pf){
  const ids = new Set();
  (pf||[]).forEach(f=>{ if(brokeWithinYear(f)) ids.add(String(f.fobId||"").toLowerCase()); });
  return ids.size;
}

}

var fobSel = {};
window.toggleFobPick = (u, ev)=>{ if(ev) ev.stopPropagation();
  if(fobSel[u]){ delete fobSel[u]; }
  else {
    const sel = S.fobs.filter(f=>fobSel[f.uid]);
    if(sel.length >= 10){ toast('10 at a time only — send these first, then pick the next batch'); return; }
    const me = S.fobs.find(f=>f.uid===u);
    if(sel.length && me && sel[0].prop !== me.prop){ toast('\u26A0\uFE0F Same hotel only — this batch is '+propName(sel[0].prop)+'. Send it or clear it before picking another hotel.'); return; }
    fobSel[u] = 1;
  }
  renderFobs();
};
window.clearFobSel = ()=>{ fobSel = {}; renderFobs(); };
window.emailSelectedFobs = ()=>{
  const sel = S.fobs.filter(f=>fobSel[f.uid]);
  if(!sel.length){ toast('Check at least one fob first'); return; }
  if(sel.length > 10){ toast('10 at a time only — send these first'); return; }
  const now = new Date();
  const lines = ['Secure Alert Tracking — Fobs Sent to Support ('+sel.length+')', '', 'Date sent: '+todayISO(), 'Time sent: '+now.toLocaleTimeString(), ''];
  sel.forEach((f, i)=>{
    lines.push((i+1)+'. FOB ID: '+f.fobId+(f.num ? '  (Fob number: '+f.num+')' : ''));
    lines.push('   Hotel: '+propLabel(f.prop)+'  |  Department: '+(f.dept||'—')+'  |  Status: '+f.status+((f.also && f.also.length) ? ' + '+f.also.join(', ') : ''));
    lines.push('   Assigned to: '+(f.staff||'—')+(f.shift ? ' ('+f.shift+')' : '')+'  |  Last test: '+(f.battery||'—'));
    if(f.notes) lines.push('   Notes: '+f.notes);
    if(f.replId) lines.push('   Replaced by: '+f.replId+' @ '+propLabel(f.replProp));
    lines.push('');
  });
  const sig = '\n—\nDigitally signed:\n'+((S.session && S.session.name) || 'Jeremy Levin')+'\nSecurity Systems Technology, Loews Hotels & Co at Universal Orlando\nDesk: (407) 503-9545\nSigned: '+now.toLocaleString();
  const props = [...new Set(sel.map(f=>f.prop))];
  if(props.length > 1){ toast('\u26A0\uFE0F Same hotel only — a send can only have fobs from one hotel.'); return; }
  composeMail('Secure Alert Fobs — '+sel.length+' fob'+(sel.length > 1 ? 's' : '')+' for support', lines.join('\n')+sig, props.length === 1 ? props[0] : 'ALL', VENDOR_TO, VENDOR_LABEL, EJ_TEMPLATE_VENDOR);
  window._clrFobSel = true;
};
function renderFobs(){

function downloadReport(filename, html){
  try{
    const blob=new Blob([html],{type:"text/html"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{URL.revokeObjectURL(a.href);}catch(e){} a.remove(); },5000);
    return true;
  }catch(e){ return false; }
}

function standaloneReport(title, bodyHtml){
  const css="body{font-family:Arial,sans-serif;margin:40px;color:#222}"
    +"h1{font-size:22px;margin-bottom:4px}h2{font-size:14px;color:#666;font-weight:normal;margin-top:0}"
    +"table{width:100%;border-collapse:collapse;margin-top:20px}"
    +"th{background:#0F2440;color:#fff;padding:10px;text-align:left;font-size:13px}"
    +"td{padding:9px 10px;border-bottom:1px solid #ddd;font-size:14px}"
    +".foot{margin-top:20px;font-size:12px;color:#888}";
  return "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">"
    +"<title>"+title+"</title><style>"+css+"</style></head><body>"
    +bodyHtml+'<script>window.onload=function(){window.print();}<\/script>'+"</body></html>";
}
function printReport(title, bodyHtml){
  var html = standaloneReport(title, bodyHtml);
  // Add auto-print script (escaped to avoid breaking the outer script block)
  html = html.replace('</body>', '<script>window.onload=function(){setTimeout(function(){window.print();},500);};<\/script></body>');
  var w = window.open('', '_blank');
  if(w){
    w.document.write(html);
    w.document.close();
  }else{
    // Fallback to download if popup blocked
    var fname = title.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".html";
    var ok = downloadReport(fname, html);
    if(typeof toast==="function") toast(ok ? "Popup blocked — report downloaded, open it to print" : "Couldn't save the report.");
  }
}

function parseCSV(t){
  const rows=[]; let row=[], v="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){v+='"';i++;} else q=false; } else v+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(v); v=""; }
    else if(c==="\n"){ row.push(v); rows.push(row); row=[]; v=""; }
    else if(c!=="\r") v+=c;
  }
  if(v!==""||row.length){ row.push(v); rows.push(row); }
  return rows.filter(r=>r.length&&r.some(x=>String(x).trim()!==""));
}
window.importCSV = inp=>{
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rows=parseCSV(r.result); if(rows.length<2){ alert("No data rows found."); return; }
      const head=rows[0].map(h=>h.trim().toLowerCase()); let n=0;
      const gi=n2=>head.indexOf(n2);
      if(gi("fob_id")>-1 && gi("tracking_number")>-1){
        rows.slice(1).forEach(rr=>{
          const fobId=(rr[gi("fob_id")]||"").trim(); if(!fobId) return;
          S.subs.push({uid:uid("sub"), fobId:fobId, prop:(rr[gi("hotel")]||"").trim().toUpperCase()||"CBBR",
            date:(rr[gi("date_submitted")]||"").trim()||todayISO(), tracking:(rr[gi("tracking_number")]||"").trim(),
            status:(rr[gi("status")]||"").trim()||"Submitted", notes:(rr[gi("notes")]||"").trim(),
            created:nowLocal(), hist:[{t:nowLocal(),e:"Imported"}]}); n++;
        });
      }else if(gi("fob_id")>-1){
        rows.slice(1).forEach(rr=>{
          const fobId=(rr[gi("fob_id")]||"").trim(); if(!fobId) return;

/* ---------- QR scanner ---------- */
let scanStream=null, scanTarget=null, scanRAF=null, scanRestore=null;
function stopScanTracks(){ if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } }
let zxingReader=null, zxingLoading=false;
function loadZXing(){
  if(window.ZXing||zxingLoading) return; zxingLoading=true;
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/zxing.min.js";
  s.onload=function(){ zxingLoading=false; };
  s.onerror=function(){ zxingLoading=false; };
  document.head.appendChild(s);
}
function decodeFrame(cv, cx){
  let img=null;
  try{ img=cx.getImageData(0,0,cv.width,cv.height); }catch(e){ return null; }
  try{ const q=jsQR(img.data,cv.width,cv.height); if(q&&q.data) return String(q.data).trim(); }catch(e){}
  if(window.ZXing){
    try{
      if(!zxingReader){
        zxingReader=new ZXing.MultiFormatReader();
        const hints=new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.PDF_417]);
        zxingReader.setHints(hints);
      }
      const d=img.data, argb=new Int32Array(d.length/4);
      for(let i=0,j=0;i<d.length;i+=4,j++){ argb[j]=((d[i+3]&0xff)<<24)|((d[i]&0xff)<<16)|((d[i+1]&0xff)<<8)|(d[i+2]&0xff); }
      const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.RGBLuminanceSource(argb,cv.width,cv.height)));
      const r=zxingReader.decode(bmp);
      if(r&&r.getText()) return String(r.getText()).trim();
    }catch(e){}
  }
  return null;
}

window.openScanner = targetId=>{
  scanTarget=targetId;
  try{ const vals={}; sheet.querySelectorAll("input,select,textarea").forEach(el=>{ if(el.id) vals[el.id]={v:el.value,c:el.checked}; }); scanRestore={html:sheet.innerHTML, vals:vals}; }catch(e){ scanRestore=null; }
  openSheet('<h2>Scan code</h2><div class="sub">Point the camera at the QR code or barcode, or take a photo of it.</div>'
    +'<div id="scanwrap"><video id="scanvideo" playsinline muted></video></div>'
    +'<canvas id="scancv" style="display:none"></canvas>'
    +'<div id="scanmsg" class="note">Starting camera…</div>'
    +'<button class="btn btn-primary" onclick="document.getElementById(\'scanfile\').click()">Take photo instead</button>'
    +'<input type="file" id="scanfile" accept="image/*" capture="environment" style="display:none">'
    +'<label style="margin-top:14px">Or enter the ID manually</label>'
    +'<div class="idrow"><input type="text" id="scanmanual" placeholder="Type FOB ID"><button class="btn btn-gold btn-sm" onclick="useManualScan()">Use</button></div>'
    +'<button class="btn btn-ghost" onclick="closeScanner()">Cancel</button>');
  document.getElementById("scanfile").addEventListener("change", scanFromPhoto);
  loadZXing();
  startScanCamera();
};
function startScanCamera(){
  const msg=document.getElementById("scanmsg");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ msg.textContent="Live camera not available here — use Take photo instead."; return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}}).then(st=>{
    scanStream=st; const v=document.getElementById("scanvideo"); if(!v){ stopScanTracks(); return; }
    v.srcObject=st; v.play(); msg.textContent="Point at the QR code…"; scanTick();
  }).catch(()=>{ const m=document.getElementById("scanmsg"); if(m) m.textContent="Camera blocked or unavailable — use Take photo instead."; });
}
let scanLastTry=0;
function scanTick(){
  const v=document.getElementById("scanvideo"); if(!v||!scanStream) return;
  const nowT=Date.now();
  if(v.readyState===v.HAVE_ENOUGH_DATA && nowT-scanLastTry>=180){
    scanLastTry=nowT;
    const cv=document.getElementById("scancv");
    const dsc=Math.min(1, 640/Math.max(v.videoWidth||640, v.videoHeight||480));
    cv.width=Math.round((v.videoWidth||640)*dsc); cv.height=Math.round((v.videoHeight||480)*dsc);
    if(cv.width){
      const cx=cv.getContext("2d"); cx.drawImage(v,0,0,cv.width,cv.height);
      const hit=decodeFrame(cv,cx);
      if(hit){ onScanResult(hit); return; }
    }
  }
  scanRAF=requestAnimationFrame(scanTick);
}
function scanFromPhoto(ev){
  const f=ev.target.files[0]; if(!f) return;
  const msg=document.getElementById("scanmsg"); msg.textContent="Reading photo…";
  const img=new Image();
  img.onload=()=>{
    const cv=document.getElementById("scancv");
    const sc=Math.min(1, 1200/Math.max(img.width,img.height));
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    const cx=cv.getContext("2d"); cx.drawImage(img,0,0,cv.width,cv.height);
    const hit=decodeFrame(cv,cx);
    if(hit){ onScanResult(hit); URL.revokeObjectURL(img.src); return; }
    msg.textContent="No code found — try again or enter the ID manually.";
    URL.revokeObjectURL(img.src);
  };
  img.onerror=()=>{ msg.textContent="Could not read that photo."; };
  img.src=URL.createObjectURL(f);
}
window.useManualScan=()=>{
  const v=document.getElementById("scanmanual").value.trim();
  if(!v){ alert("Type the FOB ID first."); return; }
  onScanResult(v);
};
function onScanResult(code){
  stopScanTracks();
  closeScanner();
  const t=scanTarget&&document.getElementById(scanTarget);
  if(t){ t.value=code; try{ t.focus(); }catch(e){} }
  toast("Scanned: "+code);
};
window.closeScanner = function(){
  stopScanTracks();

};
